<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c0a09"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="العمارة"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><title>العمارة — المرصد الفلكي الإسلامي</title>
<style>
/* ===== العمارة — Radical redesign (engine untouched) ===== */
:root {
  --bg: #0c0a09;
  --bg2: #1c1917;
  --card: #1a1614;
  --card2: #221e1b;
  --line: #3f342c;
  --copper: #d4a574;
  --copper2: #e8c9a0;
  --ember: #c45c26;
  --ember2: #e07a3a;
  --text: #f5f0e8;
  --muted: #a89880;
  --ok: #7cb87c;
  --radius: 12px;
  --font: "Segoe UI", Tahoma, system-ui, sans-serif;
}
:root[data-theme="light"] {
  --bg: #f7f3ec;
  --bg2: #efe8dc;
  --card: #ffffff;
  --card2: #faf7f2;
  --line: #e0d5c4;
  --copper: #9a6b2f;
  --copper2: #b8860b;
  --ember: #c45c26;
  --ember2: #a04820;
  --text: #1c1410;
  --muted: #6b5d4d;
  --ok: #2d6a2d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(196,92,38,0.12), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(212,165,116,0.06), transparent);
  color: var(--text);
  font-family: var(--font);
  max-width: 440px;
  margin: 0 auto;
  padding: 12px 14px calc(88px + env(safe-area-inset-bottom, 0px));
  line-height: 1.45;
}

/* Header — completely different */
.brandHeader {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
.brandAstro {
  width: 44px; height: 44px;
  flex-shrink: 0;
  border: 1.5px solid var(--copper);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--card2), var(--bg2));
  box-shadow: 0 0 20px rgba(212,165,116,0.15);
}
.brandAstro svg {
  width: 28px; height: 28px;
  stroke: var(--copper);
  fill: none;
  stroke-width: 1.5;
}
.brandHeader h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--copper2);
  letter-spacing: 0.02em;
  margin: 0;
}
.brandHeader .mu { font-size: 11px; color: var(--muted); margin-top: 2px; }
#hd {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 14px;
  padding: 6px 10px;
  background: var(--card);
  border-radius: 8px;
  border-right: 3px solid var(--ember);
}

/* Clock + Next — stacked differently */
.ck {
  text-align: center;
  padding: 8px 0 4px;
}
#ck {
  font-size: 36px;
  font-weight: 300;
  letter-spacing: 0.08em;
  direction: ltr;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
#cz {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.05em;
}
.nx {
  margin: 12px 0 16px;
  padding: 16px 18px;
  background: linear-gradient(135deg, #2a1810 0%, #3d2418 50%, #2a1810 100%);
  border: 1px solid var(--ember);
  border-radius: 4px 16px 4px 16px;
  text-align: center;
  color: #fff;
  box-shadow: 0 8px 24px rgba(196,92,38,0.2);
  position: relative;
  overflow: hidden;
}
:root[data-theme="light"] .nx {
  background: linear-gradient(135deg, #c45c26, #e07a3a);
  border-color: #a04820;
}
.nx::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--copper), transparent);
}
.nx #nl { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
.nx .t {
  font-size: 30px;
  font-weight: 600;
  direction: ltr;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
}
.nx #nn { font-size: 13px; margin-top: 6px; opacity: 0.9; color: var(--copper2); }
:root[data-theme="light"] .nx #nn { color: #fff; }

/* BOTTOM navigation — radical change from top pills */
nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 440px;
  z-index: 100;
  background: rgba(12,10,9,0.94);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
}
:root[data-theme="light"] nav {
  background: rgba(247,243,236,0.95);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
}
#nv {
  display: flex;
  justify-content: space-around;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 2px;
}
#nv::-webkit-scrollbar { display: none; }
#nv button {
  flex: 1 1 0;
  min-width: 0;
  max-width: 72px;
  padding: 8px 2px 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#nv button i {
  font-style: normal;
  font-size: 18px;
  line-height: 1;
  display: block;
}
#nv button.on {
  color: var(--copper2);
  background: rgba(212,165,116,0.12);
}
#nv button.on i { transform: scale(1.08); }

/* Cards — left accent, angular feel */
.cd {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  border-right: 3px solid var(--copper);
  padding: 14px 14px 12px;
  margin: 10px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.cd h2 {
  display: block;
  margin: 0 0 12px;
  font-size: 12px;
  font-weight: 700;
  color: var(--copper);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 0 8px;
  border-bottom: 1px solid var(--line);
  background: none;
  border-radius: 0;
}

/* Forms */
.r { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
.r > * { flex: 1; min-width: 0; }
input, select, button {
  font: inherit;
  color: var(--text);
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 12px;
}
button { cursor: pointer; font-weight: 600; transition: 0.15s; }
button:active { transform: scale(0.98); }
button.on, .r button.on {
  background: var(--ember);
  color: #fff;
  border-color: var(--ember);
  box-shadow: 0 4px 14px rgba(196,92,38,0.3);
}
#gps, #installBtn, #fsBtn, #shareBtn, #skyRefresh, #skyGrid, #cb {
  background: var(--card2);
  border-color: var(--copper);
  color: var(--copper2);
}
#gps:active, #installBtn:active { background: var(--ember); color: #fff; border-color: var(--ember); }

.mu { color: var(--muted); font-size: 12px; }
.gpsHint { margin-top: 6px; font-size: 11px; }

/* Key-value rows */
.k {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}
.k:last-child { border-bottom: 0; }
.k b, .k span:last-child {
  direction: ltr;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--copper2);
}
.hl { color: var(--ember2) !important; font-weight: 700; }

/* Sections */
.p { display: none; animation: fadeUp 0.25s ease; }
.p.on { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Sky canvas */
#skyCanvas {
  width: 100%;
  height: auto;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #000;
  margin: 8px 0;
  display: block;
}

/* Compass arrow if any */
.ar {
  width: 120px; height: 120px;
  margin: 12px auto;
  position: relative;
  border: 2px solid var(--line);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.ar i {
  display: block;
  width: 4px; height: 50px;
  background: linear-gradient(to bottom, var(--ember), var(--copper));
  border-radius: 2px;
  transform-origin: center bottom;
}

/* Select full width polish */
select { appearance: none; background-image: none; }

/* Utility buttons row in settings */
#voiceSel { width: 100%; margin-top: 4px; }

/* Light theme nx text */
:root[data-theme="light"] .nx { color: #fff; }

/* Planet cards & events (required for data visibility) */
.pcard {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin: 10px 0;
}
.prow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-weight: 700;
  color: var(--copper2);
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  font-size: 12.5px;
}
.grid2 span {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
}
.grid2 b { color: var(--copper2); font-weight: 600; direction: ltr; }
.up { color: var(--ok); font-size: 12px; }
.down { color: var(--muted); font-size: 12px; }
.eventCard {
  background: var(--card2);
  border: 1px solid var(--line);
  border-right: 3px solid var(--ember);
  border-radius: 10px;
  padding: 12px;
  margin: 8px 0;
}
.eventCard b { color: var(--copper2); display: block; margin-bottom: 6px; }
.eventMeta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12.5px;
  color: var(--muted);
}
.eventMeta strong { color: var(--text); margin-right: 6px; }

function pickVoice(lang){
  const voices=speechSynthesis.getVoices()||[];
  const pref=lang.startsWith("ar")
    ?[/google.*arabic/i,/microsoft.*(naayf|hoda|fatima|maged|tariq|zariyah)/i,/\bar[-_]?(sa|eg|ae|xa)\b/i,/arabic/i]
    :lang.startsWith("fr")?[ /google.*français/i,/microsoft.*hortense/i,/fr[-_]?fr/i]
    :lang.startsWith("tr")?[ /google.*turkish/i,/tr[-_]?tr/i]
    :[/google.*us/i,/microsoft.*aria/i,/en[-_]?us/i];
  for(const re of pref){const v=voices.find(x=>re.test(x.name)||re.test(x.lang));if(v)return v}
  return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;
}
function speakChunks(chunks,lang){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const voice=pickVoice(lang);
  let i=0;
  const next=()=>{
    if(i>=chunks.length)return;
    const u=new SpeechSynthesisUtterance(chunks[i++]);
    u.lang=lang;u.rate=lang.startsWith("ar")?0.88:0.92;u.pitch=1;
    if(voice)u.voice=voice;
    u.onend=next;u.onerror=next;
    speechSynthesis.speak(u);
  };
  // voices may load async
  if(!(speechSynthesis.getVoices()||[]).length){
    speechSynthesis.onvoiceschanged=()=>{speechSynthesis.onvoiceschanged=null;const v=pickVoice(lang);next();};
    setTimeout(next,250);
  }else next();
}
